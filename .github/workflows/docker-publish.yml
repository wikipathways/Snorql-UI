name: Publish UI image to GHCR

# Builds the Snorql UI image and pushes it to the GitHub Container Registry so
# the Docker Swarm cluster (tgx1/tgx2) can pull it and schedule on either node.
# The image is self-contained: the Dockerfile COPYs assets/ + index.html and
# script.sh rewrites config.js from env at container start — no bind mount needed.

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/snorql-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# After the first successful run, make the package public in the org's package
# settings (Packages -> snorql-ui -> Package settings -> Change visibility) so
# Swarm can pull it without registry auth, per operations/publishing-container-images.md.
